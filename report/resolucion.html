<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolución de Novedades</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Reutilizamos el mismo CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            padding-top: 2rem;
        }

        .wrapper-dashboard {
            width: 98%;
            max-width: 1800px;
            margin: 1rem auto;
            padding: 1.5rem;
            background: var(--color-surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 10;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            /* Forzado de anchos para simetría */
        }

        th,
        td {
            padding: 12px 16px;
            vertical-align: middle;
            font-size: 0.85rem;
            color: var(--color-text);
            border-bottom: 1px solid var(--color-border);
        }

        th {
            font-weight: 600;
            background: var(--color-surface);
            color: var(--color-text-muted);
            letter-spacing: 0.03em;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-PENDIENTE {
            background: #ffebee;
            color: #d32f2f;
        }

        .status-ELABORACION {
            background: #fff8e1;
            color: #f57c00;
        }

        .status-FINALIZADO {
            background: #e8f5e9;
            color: #388e3c;
        }

        .action-select {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: var(--radius-input);
            border: 1px solid var(--color-border);
            outline: none;
            cursor: pointer;
        }

        .btn-print {
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: var(--radius-input);
            color: var(--color-primary);
            background: rgba(63, 81, 181, 0.1);
            border: none;
            transition: all var(--transition-base);
        }

        .btn-print:hover {
            background: rgba(63, 81, 181, 0.2);
        }

        /* ── Plantilla de impresión ── */
        @media print {
            body * {
                visibility: hidden;
            }

            #printArea,
            #printArea * {
                visibility: visible;
            }

            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                padding: 20px;
            }

            .badge,
            .status-badge {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            img {
                max-width: 100%;
                height: auto;
            }
        }

        #printArea {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Fondo animado -->
    <div id="particles-js"></div>

    <div class="container-fluid wrapper-dashboard">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1 fw-bold text-primary"><i class="fas fa-tasks me-2"></i> Resolución de Novedades</h2>
                <p class="text-muted mb-0" style="font-size: 0.9rem;">Gestiona el estado de los reportes y genera
                    constancias</p>
            </div>
            <div class="text-end">
                <div class="form-check form-switch d-inline-block me-3 align-middle text-start">
                    <input class="form-check-input mt-2" type="checkbox" id="toggleFinalizados"
                        onchange="renderTabla()">
                    <label class="form-check-label text-muted" style="font-size:0.85rem;" for="toggleFinalizados">Ver
                        Ocultas (Finalizadas)</label>
                </div>
                <a href="index.html" class="btn btn-outline-primary btn-sm align-middle"><i
                        class="fas fa-arrow-left"></i> Volver a
                    Formularios</a>
            </div>
        </div>

        <!-- ── Loader ── -->
        <div id="loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Cargando novedades...</p>
        </div>

        <!-- ── Tabla ── -->
        <div id="dataSection" class="table-container" style="display: none;">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th style="width: 12%;">Fecha Rep.</th>
                        <th style="width: 18%;">Lote / Planta</th>
                        <th style="width: 30%;">Descripción</th>
                        <th style="width: 10%; text-align: center;">Evidencia</th>
                        <th style="width: 15%;">Responsable (Planta)</th>
                        <th style="width: 10%;">Estado</th>
                        <th style="width: 5%; text-align: right;">Opciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Plantilla oculta de impresión -->
    <div id="printArea">
        <!-- Aquí se inyecta el HTML para imprimir -->
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/particles-config.js"></script>
    <script src="js/resolucion.js"></script>
</body>

</html>
