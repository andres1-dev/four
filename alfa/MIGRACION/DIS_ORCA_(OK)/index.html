<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador DIS_ORCA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #22c55e;
            --bg: #0b0f1a;
            --card: #161b2a;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2d364d;
            --accent: #f59e0b;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid var(--border);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 { font-size: 1.8rem; margin: 0; display: flex; align-items: center; gap: 12px; }
        h1 i { color: var(--primary); }

        .toolbar {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 300px;
        }
        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .search-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 15px 12px 45px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--primary); }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-success { background: var(--success); }
        .btn-outline { background: transparent; border: 1px solid var(--border); }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        thead {
            background: var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th { padding: 15px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border); }
        tr:hover { background: rgba(255,255,255,0.03); }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-pending { background: #92400e; color: #fbbf24; }
        .badge-done { background: #065f46; color: #34d399; }

        #log {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--primary);
            margin-top: 15px;
        }

        .empty-state {
            padding: 60px;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; display: block; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .json-viewer {
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-muted);
            cursor: help;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-database"></i> Visualizador DIS_ORCA</h1>
        <div id="stats" style="font-size: 0.9rem; color: var(--text-muted);">
            <span id="rowCount">0</span> registros encontrados
        </div>
    </header>

    <div class="toolbar">
        <button id="fetchBtn" class="btn">
            <i class="fa-brands fa-google-drive"></i> Cargar de Sheets
        </button>

        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por ID (REC), Colaborador o Estado..." disabled>
        </div>

        <button id="downloadBtn" class="btn btn-success" disabled>
            <i class="fa-solid fa-file-csv"></i> Descargar CSV
        </button>

        <button id="replaceBtn" class="btn" style="background:#dc2626" disabled>
            <i class="fa-solid fa-database"></i> Reemplazar DIS_ORCA
        </button>
    </div>

    <div id="log">Listo para cargar datos de la hoja <strong>DATA</strong>...</div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>ID (REC)</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Colaborador</th>
                    <th>Línea</th>
                    <th>Productora</th>
                    <th>Distribución</th>
                    <th>Fin</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr>
                    <td colspan="7">
                        <div class="empty-state">
                            <i class="fa-solid fa-table-list"></i>
                            Haz clic en "Cargar de Sheets" para visualizar los datos
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="logic.js"></script>
<script>
    const fetchBtn = document.getElementById('fetchBtn');
    const searchInput = document.getElementById('searchInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const replaceBtn = document.getElementById('replaceBtn');
    const tbody = document.getElementById('tbody');
    const log = document.getElementById('log');
    const rowCount = document.getElementById('rowCount');

    let allData = [];
    let filteredData = [];

    function addLog(msg) {
        log.innerHTML = `<i class="fa-solid fa-info-circle"></i> ${msg}`;
    }

    fetchBtn.onclick = async () => {
        fetchBtn.disabled = true;
        addLog('Conectando con Google Sheets y cruzando líneas...');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;"><i class="fa-solid fa-spinner fa-spin"></i> Cargando datos y validando productoras...</td></tr>';

        try {
            const data = await fetchOrcaFromSheets();

            // Enriquecer datos con linea y productora para el visualizador
            allData = data.map(row => {
                const rec = String(row.REC).replace(/^REC/i, '').trim();
                const linea = lineaMap.get(rec) || 'SISPRO/OTRO';
                const productora = linea.includes('ANGELES') ? '900692469' : '900616124';
                return { ...row, _linea: linea, _productora: productora };
            });

            filteredData = allData;
            renderTable();
            searchInput.disabled = false;
            downloadBtn.disabled = false;
            replaceBtn.disabled = false;
            addLog(`Se cargaron <strong>${allData.length}</strong> registros correctamente.`);
        } catch (e) {
            addLog(`<span style="color:#ef4444">Error: ${e.message}</span>`);
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Ocurrió un error al cargar los datos.</td></tr>';
        } finally {
            fetchBtn.disabled = false;
        }
    };

    replaceBtn.onclick = async () => {
        replaceBtn.disabled = true;
        addLog('Enviando registros a Edge Function...');

        try {
            const result = await replaceDIS_ORCA(allData);
            addLog(`<span style="color:#22c55e">Listo. ${result.inserted} registros insertados${result.errors > 0 ? `, ${result.errors} errores` : ''}.</span>`);
        } catch (e) {
            addLog(`<span style="color:#ef4444">Error: ${e.message}</span>`);
        } finally {
            replaceBtn.disabled = false;
        }
    };

    function renderTable() {
        tbody.innerHTML = '';
        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No se encontraron resultados</td></tr>';
            rowCount.textContent = '0';
            return;
        }

        filteredData.forEach(row => {
            const tr = document.createElement('tr');
            const isDone = (row.ESTADO || '').toUpperCase() === 'FINALIZADO';
            const isAngeles = row._productora === '900692469';
            
            tr.innerHTML = `
                <td style="font-weight:bold; color:var(--primary)">${row.REC}</td>
                <td style="white-space:nowrap; font-size:0.8rem">${row.GUARDADO || '—'}</td>
                <td><span class="badge ${isDone ? 'badge-done' : 'badge-pending'}">${row.ESTADO || 'PENDIENTE'}</span></td>
                <td style="font-size:0.85rem">${row.COLABORADOR || '—'}</td>
                <td style="font-size:0.75rem; color:var(--accent)">${row._linea}</td>
                <td style="font-family:monospace; font-size:0.8rem; color:${isAngeles?'#86efac':'#94a3b8'}">${row._productora}</td>
                <td><div class="json-viewer" title='${row.DISTRIBUCION}'>${row.DISTRIBUCION}</div></td>
                <td style="font-size:0.8rem">${row.FIN || '—'}</td>
            `;
            tbody.appendChild(tr);
        });
        rowCount.textContent = filteredData.length;
    }

    searchInput.oninput = (e) => {
        const term = e.target.value.toLowerCase();
        filteredData = allData.filter(row => 
            String(row.REC).toLowerCase().includes(term) ||
            String(row.COLABORADOR).toLowerCase().includes(term) ||
            String(row.ESTADO).toLowerCase().includes(term)
        );
        renderTable();
    };

    downloadBtn.onclick = () => {
        // Transformar para el formato Supabase antes de descargar
        const supabaseFormat = filteredData.map(row => transformRowOrca(row));
        const csv = Papa.unparse(supabaseFormat);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `ORCA_EXPORT_${new Date().getTime()}.csv`);
        link.click();
    };
</script>

</body>
</html>
