<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos — Iniciar Sesión</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.32/dist/codicon.css" rel="stylesheet">
    <script>
        (function(){
            document.documentElement.className = localStorage.getItem('theme') || 'vscode-light';
        })();
    </script>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        /* ── Tokens ── */
        html.vscode-light {
            --primary:      #0078d4;
            --primary-dim:  rgba(0,120,212,0.13);
            --primary-glow: rgba(0,120,212,0.38);
            --glass:        rgba(255,255,255,0.55);
            --glass-inner:  rgba(255,255,255,0.82);
            --mirror:       rgba(255,255,255,0.28);
            --mirror-edge:  rgba(255,255,255,0.65);
            --border:       rgba(255,255,255,0.55);
            --border-inner: rgba(0,0,0,0.07);
            --border-focus: rgba(0,120,212,0.55);
            --text:         #0f1012;
            --text-2:       #555;
            --error:        #c62828;
            --error-dim:    rgba(198,40,40,0.09);
            --success:      #107c10;
            --input-bg:     rgba(255,255,255,0.6);
            --input-border: rgba(0,0,0,0.12);
        }
        html.vscode-dark {
            --primary:      #3794ff;
            --primary-dim:  rgba(55,148,255,0.14);
            --primary-glow: rgba(55,148,255,0.42);
            --glass:        rgba(18,20,28,0.62);
            --glass-inner:  rgba(28,30,40,0.85);
            --mirror:       rgba(255,255,255,0.06);
            --mirror-edge:  rgba(255,255,255,0.14);
            --border:       rgba(255,255,255,0.09);
            --border-inner: rgba(255,255,255,0.06);
            --border-focus: rgba(55,148,255,0.5);
            --text:         #e2e4e8;
            --text-2:       #7a7e88;
            --error:        #f48771;
            --error-dim:    rgba(244,135,113,0.1);
            --success:      #89d185;
            --input-bg:     rgba(255,255,255,0.05);
            --input-border: rgba(255,255,255,0.1);
        }

        /* ── Body ── */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fallback sólido primero, luego gradientes con valores fijos */
            background-color: #a8bbd4;
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 30%, #b8cce0 0%, transparent 70%),
                radial-gradient(ellipse 60% 80% at 80% 70%, #cfdaec 0%, transparent 70%);
            overflow: hidden;
            position: relative;
        }

        html.vscode-dark body {
            background-color: #060810;
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 30%, #080b12 0%, transparent 70%),
                radial-gradient(ellipse 60% 80% at 80% 70%, #0d1018 0%, transparent 70%);
        }

        /* ── Canvas partículas ── */
        #cvs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Wrapper centrado ── */
        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 16px;
            animation: rise .6s cubic-bezier(.22,1,.36,1) both;
        }
        @keyframes rise {
            from { opacity:0; transform:translateY(36px) scale(.96); }
            to   { opacity:1; transform:translateY(0)    scale(1);   }
        }

        /* ══════════════════════════════════════
           CARD — efecto espejo / glassmorphism
        ══════════════════════════════════════ */
        .card {
            background: var(--glass);
            backdrop-filter: blur(32px) saturate(180%) brightness(1.06);
            -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.06);
            border-radius: 22px;
            border: 1px solid var(--border);
            overflow: visible;
            position: relative;
            box-shadow:
                0 32px 80px rgba(0,0,0,0.22),
                0 8px 24px  rgba(0,0,0,0.12),
                inset 0 1px 0 var(--mirror-edge),
                inset 1px 0 0 var(--mirror-edge),
                inset 0 -1px 0 rgba(0,0,0,0.08);
        }

        /* Clip para que el contenido no sobresalga */
        .card-inner {
            border-radius: 22px;
            overflow: hidden;
        }

        /* Reflejo especular diagonal — la "película espejo" */
        .card-inner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                var(--mirror-edge) 0%,
                var(--mirror) 18%,
                transparent 45%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 0;
            border-radius: inherit;
        }

        /* Segundo reflejo sutil desde abajo-derecha */
        .card-inner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                315deg,
                var(--mirror) 0%,
                transparent 40%
            );
            pointer-events: none;
            z-index: 0;
            border-radius: inherit;
        }

        /* Asegurar que el contenido quede sobre los pseudo-elementos */
        .card > * { position: relative; z-index: 1; }



        /* ── Header ── */
        .card-head {
            padding: 34px 36px 26px;
            text-align: center;
            /* espejo interno en el header */
            background: linear-gradient(
                180deg,
                var(--mirror) 0%,
                transparent 100%
            );
            border-bottom: 1px solid var(--border-inner);
        }

        .card-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .card-sub {
            font-size: 12.5px;
            color: var(--text-2);
            margin-top: 7px;
            font-weight: 400;
            letter-spacing: 0.1px;
        }

        /* ── Body ── */
        .card-body { padding: 26px 36px 30px; }

        /* ── Fields ── */
        .field { margin-bottom: 18px; }

        .field-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-2);
            margin-bottom: 7px;
        }
        .field-label i { color: var(--primary); font-size: 12px; }

        .field-wrap { position: relative; }

        .field-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .18s, box-shadow .18s, background .18s;
            /* borde superior más brillante = efecto micro-glass */
            box-shadow: inset 0 1px 0 var(--mirror-edge);
        }
        .field-input::placeholder { color: var(--text-2); opacity:.45; }
        .field-input:hover  { border-color: rgba(0,120,212,.3); }
        .field-input:focus  {
            border-color: var(--border-focus);
            background: var(--glass-inner);
            box-shadow:
                0 0 0 3px var(--primary-dim),
                inset 0 1px 0 var(--mirror-edge);
        }
        .field-input:-webkit-autofill,
        .field-input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text);
            -webkit-box-shadow: 0 0 0 1000px rgba(240,245,255,.9) inset;
        }
        html.vscode-dark .field-input:-webkit-autofill,
        html.vscode-dark .field-input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #1a1d26 inset;
        }

        .pw-input { padding-right: 42px; }

        .pw-toggle {
            position: absolute;
            right: 10px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: var(--text-2); cursor: pointer;
            padding: 3px; border-radius: 5px;
            display: flex; align-items: center;
            transition: color .15s;
        }
        .pw-toggle:hover { color: var(--text); }
        .pw-toggle i { font-size: 15px; }

        /* ── Error ── */
        .err-box {
            display: none;
            align-items: center;
            gap: 9px;
            padding: 10px 13px;
            background: var(--error-dim);
            border: 1px solid var(--error);
            border-radius: 8px;
            margin-bottom: 16px;
            animation: shake .35s ease;
        }
        @keyframes shake {
            0%,100%{ transform:translateX(0); }
            25%    { transform:translateX(-7px); }
            75%    { transform:translateX(7px); }
        }
        .err-box i { color:var(--error); font-size:14px; flex-shrink:0; }
        .err-txt { color:var(--error); font-size:12.5px; line-height:1.3; }

        /* ── Botón ── */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: .2px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 4px 20px var(--primary-glow),
                inset 0 1px 0 rgba(255,255,255,.22); /* micro-espejo en botón */
            transition: opacity .18s, transform .12s, box-shadow .18s;
        }
        /* reflejo diagonal en el botón */
        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                rgba(255,255,255,.18) 0%,
                transparent 55%
            );
            pointer-events: none;
        }
        .btn-submit:hover:not(:disabled) {
            opacity:.91;
            transform: translateY(-1px);
            box-shadow: 0 8px 32px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,.22);
        }
        .btn-submit:active:not(:disabled) { transform:translateY(0); }
        .btn-submit:disabled { opacity:.5; cursor:not-allowed; }

        /* ── Spinner ── */
        .spinner {
            width:15px; height:15px;
            border: 2px solid rgba(255,255,255,.25);
            border-top-color:#fff;
            border-radius:50%;
            animation: spin .5s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* ── Footer ── */
        .card-foot {
            border-top: 1px solid var(--border-inner);
            padding: 13px 36px;
            background: linear-gradient(0deg, var(--mirror) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .foot-txt {
            font-size: 11px;
            color: var(--text-2);
            display: flex; align-items: center; gap: 5px;
        }
        .foot-txt i { color:var(--success); font-size:11px; }

        /* Pseudo-elementos sobre card-inner */
        .card-inner::before,
        .card-inner::after {
            border-radius: inherit;
        }

        @media(max-width:440px){
            .card-head,.card-body,.card-foot{ padding-left:22px; padding-right:22px; }
        }
    </style>
</head>
<body>

<canvas id="cvs"></canvas>

<div class="wrap">
  <div class="card">
    <div class="card-inner">
    <div class="card-head">
      <div class="card-title">Ingresos</div>
      <div class="card-sub">Sistema de gestión de producción</div>
    </div>

    <div class="card-body">
      <form id="loginForm" novalidate>

        <div class="field">
          <label class="field-label" for="email">
            <i class="codicon codicon-mail"></i> Correo electrónico
          </label>
          <input type="email" id="email" class="field-input"
                 placeholder="usuario@empresa.com"
                 autocomplete="email" required autofocus>
        </div>

        <div class="field">
          <label class="field-label" for="password">
            <i class="codicon codicon-key"></i> Contraseña
          </label>
          <div class="field-wrap">
            <input type="password" id="password" class="field-input pw-input"
                   placeholder="••••••••"
                   autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="togglePw" tabindex="-1">
              <i class="codicon codicon-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="err-box" id="errBox">
          <i class="codicon codicon-error"></i>
          <span class="err-txt" id="errTxt"></span>
        </div>

        <button type="submit" class="btn-submit" id="loginBtn">
          <i class="codicon codicon-sign-in"></i>
          <span id="btnTxt">Iniciar sesión</span>
        </button>

      </form>
    </div>

    <div class="card-foot">
      <p class="foot-txt">
        <i class="codicon codicon-code"></i>
        Developed by Andrés Mendoza
      </p>
    </div>
    </div><!-- /.card-inner -->
  </div><!-- /.card -->
</div>

<script src="js/ui/particles.js"></script>
<script>
/* ── Partículas ── */
initParticles('cvs');

/* ── Auth ──────────────────────────────────────────────────────────────── */
const SUPABASE_URL      = 'https://ymaojqjdnrpfkrtuezcw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltYW9qcWpkbnJwZmtydHVlemN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTIwMTAsImV4cCI6MjEwMTQyODAxMH0.3Zzsw_sriPPjNM8emcOslLNSnadPs8cSguNUCA2MNu8';

const form      = document.getElementById('loginForm');
const emailEl   = document.getElementById('email');
const passEl    = document.getElementById('password');
const loginBtn  = document.getElementById('loginBtn');
const togglePw  = document.getElementById('togglePw');
const toggleIco = document.getElementById('toggleIcon');
const errBox    = document.getElementById('errBox');
const errTxt    = document.getElementById('errTxt');

togglePw.addEventListener('click', () => {
    const show = passEl.type === 'password';
    passEl.type        = show ? 'text' : 'password';
    toggleIco.className= show ? 'codicon codicon-eye-closed' : 'codicon codicon-eye';
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    const pass  = passEl.value;
    if(!email||!pass){ showErr('Completa todos los campos'); return; }
    if(!email.includes('@')){ showErr('Ingresa un correo válido'); return; }
    errBox.style.display='none';
    setLoading(true);
    try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
            method:'POST',
            headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
            body:JSON.stringify({email, password:pass})
        });
        if(!res.ok){ const e=await res.json(); throw new Error(e.error_description||e.message||'Error'); }
        const data = await res.json();
        sessionStorage.setItem('supabase_token',         data.access_token);
        sessionStorage.setItem('supabase_refresh_token', data.refresh_token);
        sessionStorage.setItem('supabase_token_exp',     String(data.expires_at||(Math.floor(Date.now()/1000)+(data.expires_in||3600))));
        sessionStorage.setItem('supabase_user',          JSON.stringify(data.user));
        loginBtn.style.background='#107c10';
        loginBtn.style.boxShadow='0 4px 20px rgba(16,124,16,.4)';
        loginBtn.innerHTML='<i class="codicon codicon-check"></i><span>Acceso concedido</span>';
        setTimeout(()=>{ window.location.href='index.html'; },750);
    } catch(err){
        let msg='Error al iniciar sesión';
        if(err.message.includes('Invalid login credentials')) msg='Correo o contraseña incorrectos';
        else if(err.message.includes('Email not confirmed'))  msg='Confirma tu correo electrónico';
        else if(err.message) msg=err.message;
        showErr(msg); setLoading(false);
        passEl.value=''; passEl.focus();
    }
});

function setLoading(on){
    loginBtn.disabled=on; emailEl.disabled=on; passEl.disabled=on;
    loginBtn.style.background=''; loginBtn.style.boxShadow='';
    loginBtn.innerHTML=on
        ?'<div class="spinner"></div><span>Verificando...</span>'
        :'<i class="codicon codicon-sign-in"></i><span>Iniciar sesión</span>';
}
function showErr(msg){ errTxt.textContent=msg; errBox.style.display='flex'; }
</script>
</body>
</html>
